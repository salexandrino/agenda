<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <h1>Login</h1>
    <form action="/login/submit/" method="POST">
        {% csrf_token %}
        <div align = "center">
            <label>Usuário:</label>
            <input type="text" name="username" required>
            <label>Senha:</label>
            <input type="password" name="password" required>
            <button type="submit">Entrar</button>
        </div>
    </form>

    {% for message in messages %}
        <strong>Erro</strong> {{message}}

    {% endfor %}

</body>

</html>
