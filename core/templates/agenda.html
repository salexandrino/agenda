{% extends "model_page.html" %}
{% block content %}


<h2>Agendamentos</h2>
<a href="{% url 'evento' %}">
  <button type="button">Novo Evento</button>
</a>
<ul style="font-size: 18px">
  {% for evento in eventos %}
  <li>{{ evento.titulo }} - {{ evento.data_evento|date:"d/m/Y H:i" }}</li>
  {% endfor %}
</ul>
{% endblock %}
