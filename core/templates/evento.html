{% extends "model_page.html" %}
{% block content %}

<h2>Evento</h2>
    {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    <form action="{% url 'submit_evento' %}" method="POST"> {% csrf_token %}
    <label for="titulo">Título</label>
    <input type="hidden" name="id_evento" value="{{ evento.id|default:'' }}">
    <input id="titulo" type="text" name="titulo" size="23" value="{{ evento.titulo|default:'' }}" required>
    <br>
    <label for="data_evento">Data do evento:</label>
    <br>
    <input id="data_evento" type="datetime-local" name="data_evento" value="{{ evento.get_data_input_evento|default:'' }}" required>
    <br>

    <textarea name="descricao" rows="5" cols="24">{{ evento.descricao|default:'' }}</textarea>
    <br><br>
    <button type = "submit">Salvar</button>
    <a href="{% url 'agenda' %}">Cancelar</a>
</form>

{% endblock %}
