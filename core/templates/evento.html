{% extends "model_page.html" %}
{% block content %}

<h2>Evento</h2>
    <form action="{% url 'submit_evento' %}" method="POST"> {% csrf_token %}
    <label>Titulo</label>
    <br>
    <input type="text" name ="titulo" size="23" >
    <br>
    <label> Data do Evento: </label>
    <br>
    <input type="datetime-local" name ="data_evento" >
    <br>

    <textarea name = 'descricao' rows="5" cols="24"></textarea>
    <br><br>
    <button type = "submit">Salvar</button>
    <a href="{% url 'agenda' %}">Cancelar</a>
</form>

{% endblock %}
